<text x="570" y="625" font-size="24" font-family="sans-serif" fill="#667065">「今年の写真と古い新聞の人物名が一致するか」</text>
<text x="570" y="662" font-size="24" font-family="sans-serif" fill="#667065">まずはブログ記事に残した名前を照合すること。</text>
<text x="120" y="770" font-size="24" font-family="sans-serif" fill="#876b43">佐伯が保管していた添付資料の再構成イメージ</text>
