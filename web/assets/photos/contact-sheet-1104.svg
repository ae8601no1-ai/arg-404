<text x="570" y="389" font-size="28" font-family="sans-serif" fill="#3e473d">分類：第四資料館・人物照合</text>
<rect x="540" y="440" width="720" height="70" rx="10" fill="#f5f0e3" stroke="#d5c8aa"/>
<text x="570" y="484" font-size="28" font-family="sans-serif" fill="#3e473d">参照記事：2026年9月28日</text>
