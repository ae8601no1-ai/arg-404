<text x="120" y="140" font-size="42" font-family="sans-serif" fill="#394238">写真整理票 1104</text>
<text x="120" y="188" font-size="22" font-family="sans-serif" fill="#6b7569">第四資料館・人物照合 / 冬真の添付資料</text>
