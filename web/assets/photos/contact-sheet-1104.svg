<text x="180" y="486" font-size="22" font-family="sans-serif" fill="#7a847a">整理票には人物名のみ記載</text>
<rect x="540" y="250" width="720" height="70" rx="10" fill="#f5f0e3" stroke="#d5c8aa"/>
<text x="570" y="294" font-size="28" font-family="sans-serif" fill="#3e473d">整理番号：1104</text>
